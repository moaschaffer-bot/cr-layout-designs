    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9999px; }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: #e5e7eb; outline: none; border-radius: 9999px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 9999px; background: #624fa6; cursor: pointer; }
    /* Drag-and-drop styles */
    .cat-row { position: relative; transition: background 0.15s; }
    .cat-row .drag-handle { opacity: 0; transition: opacity 0.15s; cursor: grab; user-select: none; }
    .cat-row:hover .drag-handle { opacity: 0.5; }
    .cat-row .drag-handle:hover { opacity: 1; }
    .cat-row.dragging { opacity: 0.4; }
    .cat-row.drop-above::before {
      content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 2px; background: #624fa6; z-index: 10; pointer-events: none;
    }
    .cat-row.drop-below::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #624fa6; z-index: 10; pointer-events: none;
    }
    .cat-row .drag-handle:active { cursor: grabbing; }
  </style>

// ─── APP STATE ──────────────────────────────────────────────
const state = {
  scope: 'company',          // 'company' | 'costcenter' | 'register'
  selectedCC: 'cc1',
  selectedCR: 'pos1',
  useDefault: {},            // { cc1: true, pos1: true, ... }
  screenMode: 'wide',       // 'wide' | 'mobile'
  selectedCategoryId: 'cat3',
  expandedCategories: { cat2: true, cat6: true },
  previewCategory: 'cat3',  // which category tab is active in preview
  wideColumns: 4,
  wideRowHeight: 5,
  mobileColumns: 2,
  mobileRowHeight: 4,
  selectArticlesOpen: false,
  selectArticlesSort: { field: 'name', dir: 'asc' },
  selectArticlesSearch: '',
  selectArticlesSelection: new Set(),
};

// Initialize useDefault for all CCs and registers
mockData.costCenters.forEach(cc => {
  state.useDefault[cc.id] = true;
  cc.registers.forEach(r => { state.useDefault[r.id] = true; });
});

// ─── HELPERS ────────────────────────────────────────────────
function icon(name, extra = '') {
  return `<span class="material-symbols-outlined ${extra}">${name}</span>`;
}

function findCategory(id, cats = mockData.categories) {
  for (const c of cats) {
    if (c.id === id) return c;
    if (c.children) {
      const found = findCategory(id, c.children);
      if (found) return found;
    }
  }
  return null;
}

function getAllArticleIds(cats = mockData.categories) {
  const ids = new Set();
  for (const c of cats) {
    (c.articles || []).forEach(a => ids.add(a.id));
    if (c.children) {
      for (const sc of c.children) {
        (sc.articles || []).forEach(a => ids.add(a.id));
      }
    }
  }
  return ids;
}

function allArticles() {
  const list = [];
  function walk(cats) {
    for (const c of cats) {
      (c.articles || []).forEach(a => list.push({ ...a, catId: c.id, catName: c.name }));
      if (c.children) walk(c.children);
    }
  }
  walk(mockData.categories);
  return list;
}

function getAssignedIds() {
  return getAllArticleIds(mockData.categories);
}

function formatPrice(p) {
  return p.toFixed(2).replace('.', ',');
}

function getParentCategory(catId) {
  for (const c of mockData.categories) {
    if (c.id === catId) return c;
    if (c.children && c.children.some(ch => ch.id === catId)) return c;
  }
  return null;
}

function getAllArticlesFlat() {
  const list = [];
  function walk(cats) {
    for (const c of cats) {
      (c.articles || []).forEach(a => list.push({ ...a, catId: c.id, catName: c.name, catColor: c.color }));
      if (c.children) walk(c.children);
    }
  }
  walk(mockData.categories);
  // Add unassigned articles
  (mockData.unassignedArticles || []).forEach(a => list.push({ ...a, catId: null, catName: 'Unassigned', catColor: '#9ca3af' }));
  return list;
}

function openSelectArticles() {
  const cat = findCategory(state.selectedCategoryId);
  if (!cat) return;
  const articles = cat.articles || [];
  state.selectArticlesSelection = new Set(articles.map(a => a.id));
  state.selectArticlesSearch = '';
  state.selectArticlesSort = { field: 'name', dir: 'asc' };
  state.selectArticlesOpen = true;
  render();
  // Focus search
  const el = document.getElementById('selectArticlesSearchInput');
  if (el) el.focus();
}

function closeSelectArticles() {
  state.selectArticlesOpen = false;
  render();
}

function confirmSelectArticles() {
  const cat = findCategory(state.selectedCategoryId);
  if (!cat) return;
  const allFlat = getAllArticlesFlat();
  const selectedIds = state.selectArticlesSelection;

  // Build new articles array for this category from selection
  const newArticles = [];
  for (const a of allFlat) {
    if (selectedIds.has(a.id)) {
      newArticles.push({ id: a.id, name: a.name, price: a.price, productGroup: a.productGroup, articleNr: a.articleNr, created: a.created });
    }
  }

  // Remove selected articles from their original locations (other categories + unassigned)
  const selectedSet = new Set(newArticles.map(a => a.id));
  function removeFromCats(cats) {
    for (const c of cats) {
      if (c.id !== cat.id && c.articles) {
        c.articles = c.articles.filter(a => !selectedSet.has(a.id));
      }
      if (c.children) removeFromCats(c.children);
    }
  }
  removeFromCats(mockData.categories);
  mockData.unassignedArticles = (mockData.unassignedArticles || []).filter(a => !selectedSet.has(a.id));

  // Articles that were in this category but are no longer selected go to unassigned
  const oldArticles = cat.articles || [];
  for (const a of oldArticles) {
    if (!selectedSet.has(a.id)) {
      mockData.unassignedArticles.push({ id: a.id, name: a.name, price: a.price, productGroup: a.productGroup, articleNr: a.articleNr, created: a.created });
    }
  }

  cat.articles = newArticles;
  state.selectArticlesOpen = false;
  render();
}

function toggleArticleSelection(id) {
  if (state.selectArticlesSelection.has(id)) {
    state.selectArticlesSelection.delete(id);
  } else {
    state.selectArticlesSelection.add(id);
  }
  renderSelectArticlesOverlay();
}

function sortSelectArticles(field) {
  if (state.selectArticlesSort.field === field) {
    state.selectArticlesSort.dir = state.selectArticlesSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    state.selectArticlesSort.field = field;
    state.selectArticlesSort.dir = field === 'created' ? 'desc' : 'asc';
  }
  renderSelectArticlesOverlay();
}

function toggleSelectAll() {
  const allFlat = getAllArticlesFlat();
  const search = state.selectArticlesSearch.toLowerCase();
  const filtered = search ? allFlat.filter(a => a.name.toLowerCase().includes(search)) : allFlat;
  const allSelected = filtered.every(a => state.selectArticlesSelection.has(a.id));
  if (allSelected) {
    filtered.forEach(a => state.selectArticlesSelection.delete(a.id));
  } else {
    filtered.forEach(a => state.selectArticlesSelection.add(a.id));
  }
  renderSelectArticlesOverlay();
}

// Get the active preview category, resolving parent->first child if needed
function getEffectivePreviewCategory() {
  const cat = findCategory(state.previewCategory);
  if (!cat) return null;
  // If it's a parent with children, return first child
  if (cat.children && cat.children.length > 0) {
    return cat.children[0];
  }
  return cat;
}

// Flatten visible categories for the preview tabs
function getVisibleCategories() {
  const list = [];
  for (const c of mockData.categories) {
    if (c.children && c.children.length > 0) {
      for (const sc of c.children) list.push(sc);
    } else {
      list.push(c);
    }
  }
  return list;
}

    <div class="flex-1 flex flex-col h-full min-w-0 overflow-hidden">
      ${renderToolbar()}
      ${renderInheritanceBar()}
      <div class="flex flex-1 min-h-0 overflow-hidden">
        ${renderCategoryTree()}
        ${renderPreview()}
        ${renderSettingsPanel()}
      </div>
    </div>
    ${state.selectArticlesOpen ? renderSelectArticlesModal() : ''}
  `;
  bindEvents();
}

function renderSelectArticlesModal() {
  const cat = findCategory(state.selectedCategoryId);
  const catName = cat ? cat.name : '';
  return `
  <div id="selectArticlesOverlay" class="fixed inset-0 z-50 flex justify-end" style="background:rgba(0,0,0,0.35)">
    <div class="bg-white shadow-2xl flex flex-col h-full" style="width:min(860px, 70vw);">
      <!-- Header -->
      <div class="px-6 pt-5 pb-3 border-b border-gray-200">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-lg font-bold text-gray-900">Select articles</h2>
          <button onclick="closeSelectArticles()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500 transition-colors">
            ${icon('close', 'icon-sm')}
          </button>
        </div>
        <p class="text-sm text-gray-500">${catName}</p>
        <!-- Search -->
        <div class="relative mt-3">
          <span class="material-symbols-outlined icon-sm absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
          <input id="selectArticlesSearchInput" type="text" placeholder="Search" value="${state.selectArticlesSearch}"
            class="w-full border border-gray-300 rounded-lg pl-10 pr-9 py-2 text-sm bg-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30" />
          ${state.selectArticlesSearch ? `
          <button onclick="state.selectArticlesSearch='';renderSelectArticlesOverlay();document.getElementById('selectArticlesSearchInput').focus();"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            ${icon('close', 'icon-xs')}
          </button>` : ''}
        </div>
        <!-- Select all -->
        <div class="mt-2">
          <button onclick="toggleSelectAll()" class="text-xs font-semibold text-primary hover:opacity-80 transition-colors" id="selectAllBtn">
          </button>
        </div>
      </div>
      <!-- Table body -->
      <div id="selectArticlesTableBody" class="flex-1 overflow-y-auto px-6">
      </div>
      <!-- Footer -->
      <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-end gap-3">
        <button onclick="closeSelectArticles()" class="px-5 py-2 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
        <button onclick="confirmSelectArticles()" class="px-5 py-2 text-sm font-medium text-white rounded-lg hover:opacity-90 transition-colors" style="background:#624fa6">Confirm</button>
      </div>
    </div>
  </div>`;
}

function renderSelectArticlesOverlay() {
  const allFlat = getAllArticlesFlat();
  const search = state.selectArticlesSearch.toLowerCase();
  let filtered = search ? allFlat.filter(a => a.name.toLowerCase().includes(search)) : [...allFlat];

  // Sort
  const { field, dir } = state.selectArticlesSort;
  filtered.sort((a, b) => {
    let va, vb;
    if (field === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    else if (field === 'productGroup') { va = (a.productGroup || '').toLowerCase(); vb = (b.productGroup || '').toLowerCase(); }
    else if (field === 'articleNr') { va = a.articleNr || ''; vb = b.articleNr || ''; }
    else if (field === 'price') { va = a.price; vb = b.price; }
    else if (field === 'created') { va = a.created || ''; vb = b.created || ''; }
    else { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  const allSelected = filtered.length > 0 && filtered.every(a => state.selectArticlesSelection.has(a.id));
  const selectAllBtn = document.getElementById('selectAllBtn');
  if (selectAllBtn) selectAllBtn.textContent = allSelected ? 'Deselect all' : 'Select all';

  function sortIcon(f) {
    if (state.selectArticlesSort.field !== f) return '';
    return `<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;margin-left:2px;">${state.selectArticlesSort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward'}</span>`;
  }

  const tableBody = document.getElementById('selectArticlesTableBody');
  if (!tableBody) return;
  tableBody.innerHTML = `
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-200 text-left">
          <th class="py-2 pr-2 font-medium text-gray-500 text-xs cursor-pointer select-none whitespace-nowrap" onclick="sortSelectArticles('name')" style="width:30%">Name${sortIcon('name')}</th>
          <th class="py-2 pr-2 font-medium text-gray-500 text-xs whitespace-nowrap" style="width:10%">Category</th>
          <th class="py-2 pr-2 font-medium text-gray-500 text-xs cursor-pointer select-none whitespace-nowrap" onclick="sortSelectArticles('productGroup')" style="width:16%">Product group${sortIcon('productGroup')}</th>
          <th class="py-2 pr-2 font-medium text-gray-500 text-xs cursor-pointer select-none whitespace-nowrap" onclick="sortSelectArticles('articleNr')" style="width:12%">Art.Nr${sortIcon('articleNr')}</th>
          <th class="py-2 pr-2 font-medium text-gray-500 text-xs cursor-pointer select-none whitespace-nowrap text-right" onclick="sortSelectArticles('price')" style="width:14%">Price${sortIcon('price')}</th>
          <th class="py-2 font-medium text-gray-500 text-xs cursor-pointer select-none whitespace-nowrap text-right" onclick="sortSelectArticles('created')" style="width:18%">Created${sortIcon('created')}</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map(a => {
          const isSelected = state.selectArticlesSelection.has(a.id);
          return `
          <tr class="border-b border-gray-100 cursor-pointer transition-colors hover:bg-gray-50 select-article-row"
            style="${isSelected ? 'background:rgba(98,79,166,0.1)' : ''}"
            data-article-id="${a.id}">
            <td class="py-2 pr-2 truncate text-gray-800" style="max-width:0">${a.name}</td>
            <td class="py-2 pr-2"><span class="inline-block w-3 h-3 rounded-sm" style="background:${a.catColor}" title="${a.catName}"></span></td>
            <td class="py-2 pr-2 text-gray-600 truncate" style="max-width:0">${a.productGroup || ''}</td>
            <td class="py-2 pr-2 text-gray-600">${a.articleNr || ''}</td>
            <td class="py-2 pr-2 text-gray-800 text-right whitespace-nowrap">${formatPrice(a.price)}</td>
            <td class="py-2 text-gray-600 text-right whitespace-nowrap">${a.created || ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  // Bind row clicks
  tableBody.querySelectorAll('.select-article-row').forEach(row => {
    row.addEventListener('click', () => {
      toggleArticleSelection(row.dataset.articleId);
    });
  });

  // Bind search
  const searchInput = document.getElementById('selectArticlesSearchInput');
  if (searchInput) {
    searchInput.removeEventListener('input', handleSelectArticlesSearch);
    searchInput.addEventListener('input', handleSelectArticlesSearch);
  }
}

function handleSelectArticlesSearch() {
  state.selectArticlesSearch = this.value;
  renderSelectArticlesOverlay();
}

// ─── CATEGORY TREE ──────────────────────────────────────────
function renderCategoryTree() {
  function renderRow(cat, indent = false, parentId = null) {
    const isSelected = state.selectedCategoryId === cat.id;
    const hasChildren = cat.children && cat.children.length > 0;
    const isExpanded = state.expandedCategories[cat.id];
    const isActive = cat.active;
    const catType = indent ? 'sub' : 'parent';

    let childrenHtml = '';
    if (hasChildren && isExpanded) {
      childrenHtml = cat.children.map(sc => renderRow(sc, true, cat.id)).join('');
    }

    return `
    <div>
      <div class="cat-row group flex items-center h-11 cursor-pointer transition-colors relative rounded-lg mx-2 my-0.5
        ${isSelected ? 'bg-white border border-dashed border-gray-400 shadow-sm' : 'hover:bg-gray-50'}
        ${indent ? 'ml-8' : ''}
        ${!isActive ? 'opacity-50' : ''}"
        draggable="true"
        data-cat-id="${cat.id}"
        data-cat-type="${catType}"
        ${parentId ? `data-parent-id="${parentId}"` : ''}>
        <div class="w-1 shrink-0 self-stretch rounded-l-lg" style="background:${cat.color}"></div>
        <span class="material-symbols-outlined icon-xs text-gray-400 mx-1 drag-handle">drag_indicator</span>
        ${hasChildren ? `
          <button class="chevron-btn flex items-center justify-center w-5 h-5 shrink-0" data-toggle-id="${cat.id}">
            <span class="material-symbols-outlined icon-xs text-gray-400 transition-transform ${isExpanded ? 'rotate-90' : ''}">${'chevron_right'}</span>
          </button>
        ` : '<span class="w-5 shrink-0"></span>'}
        <span class="flex-1 text-sm font-medium truncate mx-1 text-gray-800 ${!isActive ? 'line-through' : ''}">${cat.name}</span>
        <button class="toggle-active-btn shrink-0 w-9 h-5 mx-2 relative rounded-full transition-colors ${isActive ? 'bg-primary' : 'bg-gray-300'}"
          data-active-id="${cat.id}">
          <span class="absolute top-0.5 ${isActive ? 'right-0.5' : 'left-0.5'} w-4 h-4 bg-white rounded-full shadow transition-all"></span>
        </button>

      ${childrenHtml}

  return `
  <div class="w-72 border-r border-gray-200 flex flex-col h-full shrink-0 bg-white">
    <div class="flex items-center justify-between px-4 h-11 border-b border-gray-200 shrink-0">

      ${mockData.categories.map(c => renderRow(c)).join('')}

// Convert row height level (1-10) to pixels
function rowHeightToPx(level) {
  return 28 + (level - 1) * 8; // 28px at level 1, 100px at level 10
}

// ─── LAYOUT PREVIEW ─────────────────────────────────────────
function renderArticleGrid(articles, cols, rowH, colorFallback) {
  const totalSlots = Math.max(cols * 3, articles.length);
  const slots = [];
  for (let i = 0; i < totalSlots; i++) {
    slots.push(articles[i] || null);
  }
  return `
    <div class="grid gap-2" style="grid-template-columns:repeat(${cols},1fr)">
      ${slots.map(s => {
        if (s) {
          return `
          <div class="rounded-lg flex flex-col items-center justify-center text-center p-1.5 transition-colors hover:opacity-90"
            style="height:${rowH}px; background:${colorFallback}">
            <span class="text-xs font-medium leading-tight line-clamp-2 text-white">${s.name}</span>
            <span class="text-[11px] text-white/80 mt-0.5">${formatPrice(s.price)}</span>
          </div>`;
        } else {
          return `
          <div class="border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center text-gray-400 hover:border-primary hover:text-primary transition-colors cursor-pointer"
            style="height:${rowH}px">
            ${icon('add', 'icon-sm')}
          </div>`;
        }
      }).join('')}
    </div>`;
}

function renderPreview() {
  const isWide = state.screenMode === 'wide';
  const cols = isWide ? state.wideColumns : state.mobileColumns;
  const rowH = rowHeightToPx(isWide ? state.wideRowHeight : state.mobileRowHeight);

  if (isWide) {
    return renderWidePreview(cols, rowH);
  } else {
    return renderMobilePreview(cols, rowH);
  }
}

function renderWidePreview(cols, rowH) {
  const parents = mockData.categories;
  // Determine active parent
  let activeParentId = state.previewCategory;
  const directParent = getParentCategory(state.previewCategory);
  if (directParent) {
    // If previewCategory is a subcategory, highlight its parent
    const isTopLevel = parents.some(p => p.id === state.previewCategory);
    if (!isTopLevel) {
      activeParentId = directParent.id;
    }
  }

  const activeParent = findCategory(activeParentId);
  const hasChildren = activeParent && activeParent.children && activeParent.children.length > 0;

  // Determine which articles to show
  let displayCat;
  if (hasChildren) {
    // Show subcategory pills; find active subcategory
    let activeSubId = state.previewCategory;
    const isSubOfParent = activeParent.children.some(ch => ch.id === state.previewCategory);
    if (!isSubOfParent) {
      activeSubId = activeParent.children[0].id;
    }
    displayCat = findCategory(activeSubId);
  } else {
    displayCat = activeParent;
  }

  const articles = displayCat ? (displayCat.articles || []) : [];
  const catColor = displayCat ? displayCat.color : '#9ca3af';

  // Subcategory pills
  let subcatPills = '';
  if (hasChildren) {
    const activeSubId = displayCat ? displayCat.id : '';
    subcatPills = `
      <div class="flex overflow-x-auto gap-1.5 mb-2">
        ${activeParent.children.map(sc => {
          const isActive = activeSubId === sc.id;
          return `
          <button class="preview-tab shrink-0 px-3 py-1 text-[11px] font-medium whitespace-nowrap rounded-full transition-colors
            ${isActive ? 'text-white' : 'bg-white text-gray-600 hover:bg-gray-200 border border-gray-200'}
            ${!sc.active ? 'opacity-40' : ''}"
            style="${isActive ? `background:${sc.color}` : ''}"
            data-preview-cat="${sc.id}">
            ${sc.name}
          </button>`;
        }).join('')}
      </div>`;
  }

  return `
  <div class="flex-1 flex items-center justify-center bg-gray-100 overflow-auto p-6">
    <div class="transition-all duration-300 max-w-2xl w-full">
      <div class="bg-gray-50 rounded-2xl shadow-sm p-4" style="min-height:410px">
        <!-- Notch indicator -->
        <div class="flex justify-center mb-3">
          <div class="w-16 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        <!-- Tablet layout: sidebar + grid -->
        <div class="flex gap-0 h-full">
          <!-- Left sidebar: parent categories -->
          <div class="w-16 shrink-0 flex flex-col gap-1 pr-2 border-r border-gray-200 overflow-y-auto" style="max-height:360px">
            ${parents.map(p => {
              const isActive = activeParentId === p.id;
              return `
              <button class="preview-parent-tab flex flex-col items-center gap-0.5 px-1 py-2 rounded-lg transition-colors text-center
                ${isActive ? 'bg-gray-200' : 'hover:bg-gray-100'}"
                data-preview-parent="${p.id}">
                <span class="w-3 h-3 rounded-full shrink-0" style="background:${p.color}"></span>
                <span class="text-[9px] font-medium leading-tight ${isActive ? 'text-gray-900' : 'text-gray-500'} ${!p.active ? 'opacity-40 line-through' : ''}">${p.name}</span>
              </button>`;
            }).join('')}
          </div>
          <!-- Right area: subcategory pills + article grid -->
          <div class="flex-1 pl-2">
            ${subcatPills}
            ${renderArticleGrid(articles, cols, rowH, catColor)}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderMobilePreview(cols, rowH) {
  const parents = mockData.categories;
  // Determine active parent
  let activeParentId = state.previewCategory;
  const directParent = getParentCategory(state.previewCategory);
  if (directParent) {
    const isTopLevel = parents.some(p => p.id === state.previewCategory);
    if (!isTopLevel) {
      activeParentId = directParent.id;
    }
  }

  const activeParent = findCategory(activeParentId);
  const hasChildren = activeParent && activeParent.children && activeParent.children.length > 0;

  // Determine which articles to show
  let displayCat;
  if (hasChildren) {
    let activeSubId = state.previewCategory;
    const isSubOfParent = activeParent.children.some(ch => ch.id === state.previewCategory);
    if (!isSubOfParent) {
      activeSubId = activeParent.children[0].id;
    }
    displayCat = findCategory(activeSubId);
  } else {
    displayCat = activeParent;
  }

  const articles = displayCat ? (displayCat.articles || []) : [];
  const catColor = displayCat ? displayCat.color : '#9ca3af';

  // Parent tabs
  const parentTabs = `
    <div class="flex overflow-x-auto mb-2 gap-1.5">
      ${parents.map(p => {
        const isActive = activeParentId === p.id;
        return `
        <button class="preview-parent-tab shrink-0 px-3 py-1.5 text-xs font-medium whitespace-nowrap rounded-full transition-colors
          ${isActive ? 'text-white' : 'bg-white text-gray-600 hover:bg-gray-200 border border-gray-200'}
          ${!p.active ? 'opacity-40' : ''}"
          style="${isActive ? `background:${p.color}` : ''}"
          data-preview-parent="${p.id}">
          ${p.name}
        </button>`;
      }).join('')}
    </div>`;

  // Subcategory pills
  let subcatPills = '';
  if (hasChildren) {
    const activeSubId = displayCat ? displayCat.id : '';
    subcatPills = `
      <div class="flex overflow-x-auto gap-1 mb-2">
        ${activeParent.children.map(sc => {
          const isActive = activeSubId === sc.id;
          return `
          <button class="preview-tab shrink-0 px-2.5 py-1 text-[11px] font-medium whitespace-nowrap rounded-full transition-colors
            ${isActive ? 'text-white' : 'bg-white text-gray-500 hover:bg-gray-200 border border-gray-200'}
            ${!sc.active ? 'opacity-40' : ''}"
            style="${isActive ? `background:${sc.color}` : ''}"
            data-preview-cat="${sc.id}">
            ${sc.name}
          </button>`;
        }).join('')}
      </div>`;
  }

  return `
  <div class="flex-1 flex items-center justify-center bg-gray-100 overflow-auto p-6">
    <div class="transition-all duration-300 max-w-xs w-full">
      <div class="bg-gray-50 rounded-2xl shadow-sm p-4" style="min-height:540px">
        <!-- Notch indicator -->
        <div class="flex justify-center mb-3">
          <div class="w-16 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        <!-- Parent category tabs -->
        ${parentTabs}
        <!-- Subcategory pills -->
        ${subcatPills}
        <!-- Article grid -->
        ${renderArticleGrid(articles, cols, rowH, catColor)}
      </div>
    </div>
  </div>`;
}

// ─── EVENTS ─────────────────────────────────────────────────
function bindEvents() {
  // Scope buttons
  document.querySelectorAll('.scope-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.scope = btn.dataset.scope;
      render();
    });
  });

  // Scope dropdown
  const dd = document.getElementById('scopeDropdown');
  if (dd) {
    dd.addEventListener('change', () => {
      if (state.scope === 'costcenter') state.selectedCC = dd.value;
      else state.selectedCR = dd.value;
      render();
    });
  }

  // Customize / Reset
  const customizeBtn = document.getElementById('customizeBtn');
  if (customizeBtn) {
    customizeBtn.addEventListener('click', () => {
      const id = state.scope === 'costcenter' ? state.selectedCC : state.selectedCR;
      state.useDefault[id] = false;
      render();
    });
  }
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      const id = state.scope === 'costcenter' ? state.selectedCC : state.selectedCR;
      state.useDefault[id] = true;
      render();
    });
  }

  // Screen toggle
  document.querySelectorAll('.screen-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.screenMode = btn.dataset.screen;
      render();
    });
  });

  // Category row click (select)
  document.querySelectorAll('.cat-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.chevron-btn') || e.target.closest('.toggle-active-btn') || e.target.closest('.drag-handle')) return;
      const catId = row.dataset.catId;
      state.selectedCategoryId = catId;
      // For preview: if it's a parent with children, select first child; otherwise select directly
      const clickedCat = findCategory(catId);
      if (clickedCat && clickedCat.children && clickedCat.children.length > 0) {
        state.previewCategory = clickedCat.children[0].id;
      } else {
        state.previewCategory = catId;
      }
      render();
    });
  });

  // Chevron toggle
  document.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.toggleId;
      state.expandedCategories[id] = !state.expandedCategories[id];
      render();
    });
  });

  // Active toggle in tree
  document.querySelectorAll('.toggle-active-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const cat = findCategory(btn.dataset.activeId);
      if (cat) {
        cat.active = !cat.active;
        render();
      }
    });
  });

  // Preview parent category tabs/sidebar buttons
  document.querySelectorAll('.preview-parent-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const parentId = tab.dataset.previewParent;
      const parent = findCategory(parentId);
      if (parent && parent.children && parent.children.length > 0) {
        // Has subcategories — select first child
        state.previewCategory = parent.children[0].id;
        state.selectedCategoryId = parent.children[0].id;
      } else {
        state.previewCategory = parentId;
        state.selectedCategoryId = parentId;
      }
      render();
    });
  });

  // Preview subcategory tabs
  document.querySelectorAll('.preview-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.previewCategory = tab.dataset.previewCat;
      state.selectedCategoryId = tab.dataset.previewCat;
      render();
    });
  });

  // Settings: category name
  const nameInput = document.getElementById('catNameInput');
  if (nameInput) {
    nameInput.addEventListener('input', () => {
      const cat = findCategory(state.selectedCategoryId);
      if (cat) { cat.name = nameInput.value; render(); }
    });
  }

  // Settings: color swatches
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      const cat = findCategory(state.selectedCategoryId);
      if (cat) { cat.color = sw.dataset.color; render(); }
    });
  });

  // Settings: active toggle
  const catActive = document.getElementById('catActiveToggle');
  if (catActive) {
    catActive.addEventListener('click', () => {
      const cat = findCategory(state.selectedCategoryId);
      if (cat) { cat.active = !cat.active; render(); }
    });
  }

  // Wide sliders
  const wcs = document.getElementById('wideColSlider');
  if (wcs) {
    wcs.addEventListener('input', () => {
      state.wideColumns = parseInt(wcs.value);
      document.getElementById('wideColVal').textContent = wcs.value;
      renderPreviewOnly();
    });
  }
  const wrs = document.getElementById('wideRowSlider');
  if (wrs) {
    wrs.addEventListener('input', () => {
      state.wideRowHeight = parseInt(wrs.value);
      document.getElementById('wideRowVal').textContent = wrs.value;
      renderPreviewOnly();
    });
  }

  // Mobile sliders
  const mcs = document.getElementById('mobileColSlider');
  if (mcs) {
    mcs.addEventListener('input', () => {
      state.mobileColumns = parseInt(mcs.value);
      document.getElementById('mobileColVal').textContent = mcs.value;
      renderPreviewOnly();
    });
  }
  const mrs = document.getElementById('mobileRowSlider');
  if (mrs) {
    mrs.addEventListener('input', () => {
      state.mobileRowHeight = parseInt(mrs.value);
      document.getElementById('mobileRowVal').textContent = mrs.value;
      renderPreviewOnly();
    });
  }

  // Open select articles overlay
  const openBtn = document.getElementById('openSelectArticles');
  if (openBtn) {
    openBtn.addEventListener('click', () => {
      openSelectArticles();
    });
  }

  // If overlay is open, initialize its table
  if (state.selectArticlesOpen) {
    renderSelectArticlesOverlay();
    // Close on backdrop click
    const overlay = document.getElementById('selectArticlesOverlay');
    if (overlay) {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeSelectArticles();
      });
    }
  }

  // ─── DRAG AND DROP ─────────────────────────────────────────
  bindDragAndDrop();
}

function bindDragAndDrop() {
  let draggedId = null;
  let draggedType = null;
  let draggedParentId = null;

  // Track whether drag should be allowed (only from handle)
  let dragAllowed = false;

  document.querySelectorAll('.cat-row[draggable="true"]').forEach(row => {

    row.querySelector('.drag-handle')?.addEventListener('mousedown', () => {
      dragAllowed = true;
    });

    row.addEventListener('dragstart', (e) => {
      if (!dragAllowed) { e.preventDefault(); return; }
      dragAllowed = false;
      draggedId = row.dataset.catId;
      draggedType = row.dataset.catType;
      draggedParentId = row.dataset.parentId || null;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });

    row.addEventListener('dragover', (e) => {
      if (!draggedId) return;
      const targetId = row.dataset.catId;
      const targetType = row.dataset.catType;
      const targetParentId = row.dataset.parentId || null;

      // Enforce: parents only among parents, subs only within same parent
      if (draggedType === 'parent' && targetType !== 'parent') return;
      if (draggedType === 'sub' && (targetType !== 'sub' || targetParentId !== draggedParentId)) return;
      if (targetId === draggedId) return;

      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      // Determine above/below based on mouse position
      const rect = row.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      clearDropIndicators();
      if (e.clientY < midY) {
        row.classList.add('drop-above');
      } else {
        row.classList.add('drop-below');
      }
    });

    row.addEventListener('dragleave', (e) => {
      row.classList.remove('drop-above', 'drop-below');
    });

    row.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!draggedId) return;
      const targetId = row.dataset.catId;
      const targetType = row.dataset.catType;
      const targetParentId = row.dataset.parentId || null;

      // Same validation as dragover
      if (draggedType === 'parent' && targetType !== 'parent') return;
      if (draggedType === 'sub' && (targetType !== 'sub' || targetParentId !== draggedParentId)) return;
      if (targetId === draggedId) return;

      const rect = row.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      const insertAfter = e.clientY >= midY;

      // Perform the reorder
      if (draggedType === 'parent') {
        reorderInArray(mockData.categories, draggedId, targetId, insertAfter);
      } else {
        // Subcategory: reorder within parent's children
        const parent = findCategory(draggedParentId);
        if (parent && parent.children) {
          reorderInArray(parent.children, draggedId, targetId, insertAfter);
        }
      }

      clearDropIndicators();
      draggedId = null;
      draggedType = null;
      draggedParentId = null;
      render();
    });

    row.addEventListener('dragend', (e) => {
      row.classList.remove('dragging');
      clearDropIndicators();
      draggedId = null;
      draggedType = null;
      draggedParentId = null;
      dragAllowed = false;
    });
  });

  function clearDropIndicators() {
    document.querySelectorAll('.cat-row.drop-above, .cat-row.drop-below').forEach(el => {
      el.classList.remove('drop-above', 'drop-below');
    });
  }

  function reorderInArray(arr, draggedId, targetId, insertAfter) {
    const fromIdx = arr.findIndex(c => c.id === draggedId);
    const toIdx = arr.findIndex(c => c.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [item] = arr.splice(fromIdx, 1);
    // Recalculate target index after removal
    let newIdx = arr.findIndex(c => c.id === targetId);
    if (insertAfter) newIdx += 1;
    arr.splice(newIdx, 0, item);
  }
}

// Partial re-render for sliders (perf)
function renderPreviewOnly() {
  const container = document.querySelector('.flex-1.flex.items-center.justify-center');
  if (container) {
    const isWide = state.screenMode === 'wide';
    const cols = isWide ? state.wideColumns : state.mobileColumns;
    const rowH = rowHeightToPx(isWide ? state.wideRowHeight : state.mobileRowHeight);
    const grids = container.querySelectorAll('.grid');
    grids.forEach(grid => {
      grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
      grid.querySelectorAll('[style*="height"]').forEach(el => {
        el.style.height = rowH + 'px';
      });
    });
  }
}

// ─── INIT ───────────────────────────────────────────────────
render();
</script>
